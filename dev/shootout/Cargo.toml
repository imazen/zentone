# Dev-only HDR→SDR shootout / calibration tooling for zentone.
#
# This crate is deliberately NOT part of the published `zentone` package and
# NOT a workspace member: it depends on unpublished sibling checkouts
# (`../../../zenpixels`, `../../../zenpipe`, `../../../../polyfit`) via path
# deps, which cannot resolve on CI runners or for downstream consumers. Keeping
# them here — instead of in the root `Cargo.toml` — is what lets the root
# crate's manifest resolve from crates.io alone.
#
# Run from the zentone repo root:
#
#   nice -n19 cargo run --manifest-path dev/shootout/Cargo.toml --release \
#     --bin hdr_tone_map_shootout_audited
#
# Every binary under `src/bin/` corresponds to a former `examples/*.rs` that
# used to build behind the root `hdr-shootout` / `__polyfit-tools` features.
[package]
name = "zentone-dev-shootout"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Dev-only HDR→SDR shootout drivers and offline fitting tools for zentone (not published)"

# Own workspace root so cargo never tries to attach this package to a parent
# workspace.
[workspace]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
zentone = { path = "../.." }

# Sibling checkouts (unpublished APIs: `hdr-experimental` / `Bt2446A` on
# zenpixels-convert main; `zencodecs` from the zenpipe repo).
zencodecs = { path = "../../../zenpipe/zencodecs", default-features = false, features = ["jpeg", "jpeg-ultrahdr", "avif-decode", "heic-decode", "raw-decode", "raw-decode-gainmap", "std"] }
zenpixels-convert = { path = "../../../zenpixels/zenpixels-convert", default-features = false, features = ["std", "hdr-experimental", "rgb", "imgref"] }
zenpixels-dev = { package = "zenpixels", path = "../../../zenpixels/zenpixels", default-features = false, features = ["std", "imgref"] }
# Offline coefficient fitting for `src/bin/fit_pow_inv_24.rs`.
#
# KNOWN BROKEN, and not by anything in this repo: polyfit upstream has REMOVED
# the whole `rational` module. `fit_pow_inv_24.rs` imports seven types from it
# (`RationalFit`, `RationalFitOptions`, `Constraint`, `ConstraintMode`,
# `ErrorWeighting`, `F32ScoreMetric`, `F32SearchConfig`, `F32SearchResult`) and
# none of them exist any more — `ChebyshevFit` survived, but as a crate-root
# type alias (`polyfit::ChebyshevFit`), not under `rational`. So that ONE bin
# does not compile:
#     error[E0432]: unresolved import `polyfit::rational`
# The other bins are unaffected; check them directly, e.g.
#     cargo check --manifest-path dev/shootout/Cargo.toml \
#         --bin hdr_tone_map_shootout_audited
# polyfit is a path dep on a sibling checkout, so there is no rev to pin it
# back to from here, and rewriting the fit to a different basis would change
# what the tool computes. Left failing and documented rather than deleted,
# #[ignore]d, or quietly excluded.
polyfit = { path = "../../../../polyfit", default-features = false }
# `linear_srgb::tf` / `linear_srgb::default` are called by
# `src/bin/hdr_tone_map_shootout_{full,audited}.rs` but were never declared:
#     error[E0433]: cannot find module or crate `linear_srgb`
# 0.6.12 is the version zenpipe's Cargo.lock resolves, so the shootout and the
# zencodecs it path-deps into share one copy.
linear-srgb = "0.6.12"

# Manual AVIF gain-map reconstruction needs ultrahdr-core directly.
ultrahdr-core = { version = "0.5.0" }
gainforge = "0.5.0"
moxcms = ">=0.9.0, <0.10"
zensim = "0.2.6"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
bytemuck = { version = "1.25", default-features = false }
rayon = "1.10"

# Cross-crate git overrides for the transitive `zencodecs` graph. They expose
# APIs the drivers need that pre-date the latest crates.io publishes of
# `zenjpeg`, `ultrahdr-core`, `zenavif` and `heic`. Patches never exercised
# by these binaries (zenpng, zenrav1e, zenwebp, ...) are intentionally omitted
# so cargo doesn't warn about "patch never used".
[patch.crates-io]
# Pinned to the rev zenpipe's own Cargo.lock resolves, which is what keeps this
# table in step with the `zencodecs` it path-deps into. The rev has to move when
# that requirement moves: it was 9835cf5 (0.8.7) for `zenjpeg ^0.8.4`, and
# zencodecs has since gone to `^0.9.0`, which 0.8.7 does not satisfy — a fresh
# resolve died with "failed to select a version for the requirement
# `zenjpeg = ^0.9.0` … candidate versions found which didn't match: 0.8.7".
# e7c53d2e is zenjpeg 0.9.0.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "e7c53d2e36914989585791b504a957064e0e8d91" }
# `zenpixels` / `zenpixels-convert` are patched so the drivers see the same
# version of `zenpixels` through both the direct path dep and the transitive
# `zencodecs` graph. Without this, `zencodec`/`zencodecs` resolve the registry
# version while the direct deps resolve the path version, producing two
# distinct `zenpixels::PixelBuffer` types and a compile-time mismatch when
# consuming `DecodeOutput::into_buffer()`.
zenpixels = { path = "../../../zenpixels/zenpixels" }
zenpixels-convert = { path = "../../../zenpixels/zenpixels-convert" }
# Pinned to the same revs zenpipe's Cargo.lock resolves (ultrahdr-core 0.5.0,
# heic 0.2.0). Unpinned `main` of each drifted apart (ultrahdr `main` is 0.6.0,
# which `^0.5.0` rejects, while heic `main` calls 0.6.0-only APIs), so a fresh
# resolve of this graph failed to compile `heic`.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "031d4a2070a522f82bd02aee712a2806a2c17bbd" }
# zenavif: REQUIRED, and rev-pinned. `zencodecs/avif-decode` requires
# `zenavif ^0.1.7`, crates.io 0.1.7 is YANKED and 0.1.6 does not satisfy the
# requirement, so without this entry the graph does not resolve at all — it
# died with "failed to select a version for the requirement `zenavif = ^0.1.7`
# … version 0.1.7 is yanked" before any of the pins below could matter. The
# rev is the one that decides which DECODER this harness measures through:
# zenavif's own manifest carries a git-rev dep on rav1d-safe, so whatever
# zenavif rev lands here fixes the rav1d-safe rev too. e4b3820 pins
# rav1d-safe 66f58fa6, the rev zenavif, ravif and zenmetrics all settled on.
#
# WHAT FLOATS IF YOU DELETE `rev` HERE: every `cargo` invocation re-resolves
# imazen/zenavif to whatever `main` is at that moment, and with it the decoder
# underneath. This is a MEASUREMENT harness — its numbers are only comparable
# across runs if the decoder is held fixed, and the range zenavif has moved
# across since 2026-08 contains a decoder correctness change big enough to
# move them: the aarch64 NEON conformance campaign of 2026-08-07/08 took
# rav1d-safe from 302/766 to 766/766 against dav1d's published MD5 vectors,
# i.e. before it the decoder produced wrong pixels on 464 of 766. A silent
# decoder change under a harness is worse than a stale pin, because nothing
# in the output records that it happened. Keep the rev; move it deliberately.
zenavif = { git = "https://github.com/imazen/zenavif", rev = "e4b3820d24e20edd23c1ab490dedd9674ccf9f00" }
# NO rav1d-safe ENTRY HERE, DELIBERATELY. There used to be an unpinned
# `rav1d-safe = { git = "https://github.com/imazen/rav1d-safe" }` on this line.
# It was a DEAD PATCH: nothing in this graph requires rav1d-safe from
# crates.io. The only depender is zenavif, which reaches it through a git-rev
# dep on its own dep line, and `[patch.crates-io]` substitutes registry
# sources only — so the entry selected nothing.
#
# Measured, not reasoned: pointing that entry at a DIFFERENT rev (140f9145)
# still resolved rav1d-safe 0.6.0 at 66f58fa6 — the rev the zenavif pin above
# carries — and cargo emitted
#   warning: patch `rav1d-safe v0.6.0 (…?rev=140f9145…)` was not used in the
#   crate graph
# with a matching `[[patch.unused]]` block in the generated lock. A dead patch
# is worse than no patch: it reads as if this repo pins its own decoder when
# the decoder is actually decided elsewhere. The pin has ONE owner — zenavif —
# and this harness inherits it. Re-add an entry here only if some crate in
# this graph ever depends on rav1d-safe from the REGISTRY. The agreement check
# that catches an unpinned, disagreeing or newly-dead entry lives in zenpipe
# (`just check-pins` there, i.e. `scripts/check-decoder-pins.py`); point it at
# this repo with `--root /path/to/zentone` to audit these manifests too.
heic = { git = "https://github.com/imazen/heic", rev = "3fe1110ce51b05f40580724f2c0beb7e5f043911" }
