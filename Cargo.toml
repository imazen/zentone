[package]
name = "zentone"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "HDR to SDR tone mapping curves: Hable, Narkowicz, ACES, AgX, Möbius (libplacebo), ITU BT.2408 / BT.2446-B / BT.2446-C, darktable filmic spline, plus an ISO 21496-1 / Ultra HDR gain-map splitter and experimental adaptive/streaming tonemappers"
repository = "https://github.com/imazen/zentone"
documentation = "https://docs.rs/zentone"
readme = "README.crates.md"
keywords = ["hdr", "tonemap", "bt2408", "agx", "image"]
categories = ["multimedia::images", "graphics", "no-std"]
exclude = [
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".github/",
    ".workongoing",
    ".gitignore",
    "Cross.toml",
    "justfile",
    "fuzz/",
    "reference-checks/",
    "benchmarks/",
    "GAIN-MAP-ARCHITECTURE.md",
    "tests/",
]

[lints.rust]
unexpected_cfgs = { level = "allow" }
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = ["std", "avx512"]
std = ["linear-srgb/std", "archmage/std", "magetypes/std"]
# AVX-512 tier for x86-64-v4 — gates the v4 magetypes path through to
# archmage/magetypes via their `avx512` features.
avx512 = ["archmage/avx512", "magetypes/avx512"]
# Dev-only: enables archmage/testable_dispatch so benches/tier_isolation.rs can
# disable the baseline SIMD token (NEON on aarch64) and measure a real scalar
# arm. Never enable in a published build.
_dev = ["archmage/testable_dispatch"]
# Experimental APIs: Aces2OutputTransform, AdaptiveTonemapper, StreamingTonemapper,
# ProfileToneCurve, detect::*. Light test coverage; API and output may change without semver bumps
# until stabilized. (The ISO 21496-1 / Apple Ultra HDR gain-map splitter formerly
# gated here graduated to the always-available `gainmap` module.)
experimental = []
# Optional zenpixels integration: PixelSlice/PixelBuffer-level entry points
# (e.g. `gainmap::normalized_linear_to_hlg_buffer`) wrapping the dep-free
# `&mut [f32]` row kernels. The core stays container-agnostic.
zenpixels = ["dep:zenpixels"]
# Retired dev-only gate. It used to select the HDR→SDR shootout examples,
# which now live in the standalone `dev/shootout/` crate (path deps on sibling
# checkouts that cannot resolve on CI or for downstream users). Kept as a
# no-op so existing `--features hdr-shootout` invocations still parse; it was
# never part of the published API surface.
hdr-shootout = []
# Retired dev-only gate (NOT public API; the `__` prefix marks it as such). It
# used to select `examples/fit_pow_inv_24.rs`, now
# `dev/shootout/src/bin/fit_pow_inv_24.rs`. Kept as a no-op for the same
# reason as `hdr-shootout`.
__polyfit-tools = []

[dependencies]
linear-srgb = { version = "0.6.12", default-features = false, features = ["transfer"] }
zenpixels = { version = ">=0.2.14, <0.4.0", optional = true, default-features = false }
libm = { version = "0.2", default-features = false }
archmage = { version = "0.9.22", default-features = false, features = ["macros"] }
magetypes = { version = "0.9.22", default-features = false }

[dev-dependencies]
gainforge = "0.5.0"
# `benches/tonemap_bench.rs` hands `moxcms::ColorProfile` values to gainforge,
# so this instance MUST unify with gainforge's own moxcms. gainforge 0.5.0
# (the newest release within our MSRV 1.89 — 0.5.1 declares rust-version
# 1.93) requires `moxcms ^0.8`, so this range must admit 0.8.x; narrowing it
# to `>=0.9.0` (commit f32e091) split the graph into two moxcms versions and
# broke the bench with an `expected moxcms::profile::ColorProfile` mismatch.
moxcms = "0.8.1"
image = { version = "0.25", default-features = false, features = ["png"] }
zensim = "0.2.6"
# Dev-only HDR→SDR shootout / offline-fitting drivers (and their unpublished
# sibling-checkout deps + crates-io patches) live in `dev/shootout/`, NOT here:
# a root-manifest path dep that only exists on one machine breaks every cargo
# invocation on CI and for downstream `cargo package` consumers.

# Native-only: benchmark dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zenbench = { version = "0.1.6", features = ["criterion-compat"] }

[[example]]
name = "visual_compare"
required-features = ["experimental"]

[[bench]]
name = "tier_isolation"
harness = false
required-features = ["_dev"]

[[bench]]
name = "tonemap_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false
required-features = ["experimental"]
