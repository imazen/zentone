[package]
name = "zentone-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.zentone]
path = ".."
features = ["experimental"]

[[bin]]
name = "fuzz_curves"
path = "fuzz_targets/fuzz_curves.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_adaptive_fit"
path = "fuzz_targets/fuzz_adaptive_fit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_streaming"
path = "fuzz_targets/fuzz_streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_profile_curve"
path = "fuzz_targets/fuzz_profile_curve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_filmic_params"
path = "fuzz_targets/fuzz_filmic_params.rs"
test = false
doc = false
bench = false

# Current operation implementations used by standalone checks.
[patch.crates-io]

linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }

garb = { git = "https://github.com/imazen/garb", rev = "605276d717ea0b31a1cd2a36ae05301383c7b8b5" }

zentone = { git = "https://github.com/imazen/zentone", rev = "4b5ab710157743e3018b7de3a79f336c2f61113e" }
